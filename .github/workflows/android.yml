name: Zostavenie Android aplikácie

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'store/**'
      - 'docs/**'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

            - name: Súhlas s licenciami Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Kontrola tajomstiev (secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Chýba tajomstvo $v. Pridaj ho v Settings > Secrets and variables > Actions (pozri README)."
              exit 1
            fi
          done

      - name: Inštalácia balíkov
        run: npm ci

      - name: Vytvorenie Android projektu
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Podpisový kľúč
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Zostavenie (.aab a .apk)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Nahrať .aab (na Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: moj-psik-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Nahrať .apk (na vyskúšanie v telefóne)
        uses: actions/upload-artifact@v4
        with:
          name: moj-psik-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
